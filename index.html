<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4-Quadrant 재측정 분석 — 마케팅본부 표본팀</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    max-width: 820px;
    margin: 40px auto;
    padding: 0 20px;
    color: #1a1a1a;
    background: #fcfcfb;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  p.sub { color: #595959; font-size: 14px; margin-top: 0; margin-bottom: 24px; }
  .legend {
    display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 10px;
    font-size: 13px; color: #444;
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #2a78d6; display: inline-block; }
  .sq { width: 10px; height: 10px; border-radius: 2px; background: #4a3aa7; display: inline-block; }
  .chart-wrap { position: relative; width: 100%; height: 460px; background: #fff; border: 1px solid #e5e3dc; border-radius: 12px; padding: 12px; box-sizing: border-box; }
  footer { margin-top: 20px; font-size: 12px; color: #8a8a8a; }
</style>
</head>
<body>
  <h1>4-Quadrant 재측정 분석</h1>
  <p class="sub">마케팅본부 표본팀 — X축: 재측정 시점 Resistance Score · Y축: 개입 전후 변화 폭 (Before − After)</p>

  <div class="legend">
    <span><span class="dot"></span>개인 저항요인 (10명 × 12개 = 120)</span>
    <span><span class="sq"></span>팀 저항요인 (8개)</span>
  </div>

  <div class="chart-wrap">
    <canvas id="quadChart" role="img" aria-label="4분면 산점도: X축 재측정 시점 Resistance Score, Y축 개입 전후 변화 폭. 개인 120개 점과 팀 8개 점 표시">4분면 분석 산점도</canvas>
  </div>

  <footer>집중 개선 영역: 아직 높지만 크게 개선 중 · 잔존 저항 영역: 여전히 높고 변화 작음 · 개선 유지 영역: 크게 개선되어 낮아짐 · 안정 영역: 원래도 낮고 변화 없음</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const people = ["박서연","이하은","최민준","정유진","강태호","윤소희","한지민","오승민","배수아","조현우"];
const primary = {"박서연":"Prompting","이하은":"Value Awareness","최민준":"Routine 유사","정유진":null,"강태호":"Prompting","윤소희":"Accuracy","한지민":"Switching Cost 유사","오승민":"Convenience 유사","배수아":"Feature Knowledge","조현우":"Verification"};
const factors = ["Need Relevance","Value Awareness","Value Experience","Comparative Value","Feature Knowledge","Prompting","Task Application","Output Utilization","Accuracy","Verification","Security","Responsibility"];
function seeded(s){let x=Math.sin(s)*10000;return x-Math.floor(x);}
let seed=1;
const indPts=[];
people.forEach((p)=>{
  factors.forEach((f)=>{
    const r1=seeded(seed++), r2=seeded(seed++);
    const isPrimary = primary[p] && f.startsWith(primary[p].split(" ")[0]);
    let before = isPrimary ? 68+r1*22 : 8+r1*45;
    let delta = isPrimary ? 25+r2*28 : -6+r2*20;
    if(p==="정유진") { before = 6+r1*10; delta = 1+r2*6; }
    const after = Math.max(2, before-delta);
    indPts.push({x:Math.round(after),y:Math.round(before-after),label:p+" - "+f});
  });
});
const teamFactors = [
  {n:"Leadership",b:76.5,d:44.5},{n:"Direction",b:88,d:34},{n:"Reinforcement",b:58,d:6},
  {n:"Psychological Safety",b:40,d:12},{n:"Collaboration",b:62,d:24},{n:"Knowledge Diffusion",b:72,d:7},
  {n:"Peer Learning",b:35,d:5},{n:"Collective Adoption",b:55,d:-5}
];
const teamPts = teamFactors.map(t=>({x:Math.round(t.b-t.d),y:Math.round(t.d),label:"팀 - "+t.n}));

const qColors = {tr:'rgba(250,199,117,0.35)',br:'rgba(240,149,149,0.35)',tl:'rgba(159,225,203,0.35)',bl:'rgba(211,209,199,0.35)'};
const textColor = '#52514e';

const quadPlugin = {
  id:'quad',
  beforeDatasetsDraw(chart){
    const {ctx, chartArea:{left,right,top,bottom}, scales:{x,y}} = chart;
    const xm = x.getPixelForValue(50), ym = y.getPixelForValue(20);
    ctx.save();
    ctx.fillStyle = qColors.tr; ctx.fillRect(xm, top, right-xm, ym-top);
    ctx.fillStyle = qColors.br; ctx.fillRect(xm, ym, right-xm, bottom-ym);
    ctx.fillStyle = qColors.tl; ctx.fillRect(left, top, xm-left, ym-top);
    ctx.fillStyle = qColors.bl; ctx.fillRect(left, ym, xm-left, bottom-ym);
    ctx.strokeStyle = 'rgba(0,0,0,0.12)';
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(xm,top); ctx.lineTo(xm,bottom); ctx.moveTo(left,ym); ctx.lineTo(right,ym); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '600 12px sans-serif'; ctx.fillStyle = textColor;
    ctx.fillText('집중 개선 영역', xm+10, top+16);
    ctx.fillText('잔존 저항 영역', xm+10, ym+16);
    ctx.fillText('개선 유지 영역', left+10, top+16);
    ctx.fillText('안정 영역', left+10, ym+16);
    ctx.restore();
  }
};

new Chart(document.getElementById('quadChart'), {
  type:'scatter',
  data:{datasets:[
    {label:'개인', data:indPts, backgroundColor:'rgba(42,120,214,0.55)', pointRadius:5, pointHoverRadius:7},
    {label:'팀', data:teamPts, backgroundColor:'#4a3aa7', pointStyle:'rectRot', pointRadius:8, pointHoverRadius:10}
  ]},
  options:{
    responsive:true, maintainAspectRatio:false,
    layout:{padding:8},
    scales:{
      x:{min:0,max:100,title:{display:true,text:'Resistance Score (재측정 시점)',color:textColor},ticks:{color:textColor},grid:{color:'#e1e0d9'}},
      y:{min:-12,max:58,title:{display:true,text:'변화 폭 (Before - After)',color:textColor},ticks:{color:textColor},grid:{color:'#e1e0d9'}}
    },
    plugins:{
      legend:{display:false},
      tooltip:{callbacks:{label:(ctx)=>{const d=ctx.raw;return d.label+': Score '+d.x+', 변화 '+d.y;}}}
    }
  },
  plugins:[quadPlugin]
});
</script>
</body>
</html>
